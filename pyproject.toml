[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ferreyros-propension"
version = "0.2.0"
requires-python = ">=3.12"
description = "Propensión por visita con evaluación temporal"

[tool.setuptools.packages.find]
where = ["."]
include = ["src"]


[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"*.ipynb" = ["E402"]
